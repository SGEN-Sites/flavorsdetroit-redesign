<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Night drive · splash concept 4 · Flavors Detroit</title>
<script>
/* Decide before first paint. The splash only runs when motion is welcome; with ?once=1 it also
   runs only once per browser session. ?rm=1 previews what reduced-motion visitors get.
   ?play=1 (options page only) plays it even on a device set to reduce motion, so an owner with
   that setting can still judge the concepts. */
(function (d, w) {
  var r = d.documentElement, q = w.location.search, reduce = /[?&]rm=1(&|$)/.test(q), play = /[?&]play=1(&|$)/.test(q), seen = false;
  try { reduce = reduce || (!play && w.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
  if (/[?&]once=1(&|$)/.test(q)) { try { seen = w.sessionStorage.getItem('flavors-splash') === '1'; } catch (e) {} }
  r.setAttribute('data-splash', reduce ? 'reduced' : seen ? 'seen' : 'pending');
  if (reduce || seen) return;
  r.classList.add('splash-on');
  if (play) r.classList.add('splash-force');
  /* fail-safe: if the splash script never runs, hand the page over after 4 s */
  w.setTimeout(function () { if (r.classList.contains('splash-on') && /pending|loading/.test(r.getAttribute('data-splash'))) { r.classList.remove('splash-on'); r.setAttribute('data-splash', 'failsafe'); } }, 4000);
})(document, window);
</script>
<link rel="preload" href="../assets/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/tilt-neon.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="splash.css">
<style>
/* Concept 4, night drive (2.30 s):
   0.08-2.26 s  headlight trails (left to right) and tail-light trails (right to left) streak along the road
   0.10-1.00 s  their light washes across the sign; each bulb switches on as the light reaches it,
                the sign comes up and the neon 5700 catches
   1.70-2.30 s  the last car pulls the splash off to the right, revealing the page */
.splash--drive .bg {
  position: absolute; top: 0; bottom: 0; left: -40cqw; width: 140cqw;
  background: linear-gradient(90deg, rgb(8 9 11 / 0), var(--black) 28.6%);
}
.splash--drive .drive { position: absolute; inset: 0; --sign-w: min(74cqw, 50cqh, 480px); }
.splash--drive .rig { position: absolute; left: 50%; top: 42%; width: var(--sign-w); aspect-ratio: 960 / 1090; translate: -50% -50%; }
.splash--drive .glow { top: 36%; }
.splash--drive .board { position: absolute; left: 0; top: 0; }
.splash--drive .logo { filter: drop-shadow(0 0 1px rgb(195 202 236 / .4)); }
.splash--drive .tower { top: calc(var(--sign-w) * .5); height: 100cqh; }
.splash--drive .plate { top: calc(var(--sign-w) * .835); }
/* the headlights' light pool washing across the sign; bulbs switch on as its centre reaches them */
.splash--drive .sweep {
  position: absolute; top: 6cqh; height: 66cqh; left: 0; width: 44cqw; pointer-events: none;
  background: radial-gradient(closest-side, rgb(195 202 236 / .16), rgb(195 202 236 / .06) 55%, rgb(195 202 236 / 0));
}
.splash--drive .road { position: absolute; left: -10cqw; width: 120cqw; bottom: 4cqh; height: 21cqh; rotate: -2deg; pointer-events: none; }
.splash--drive .trail {
  position: absolute; left: 0; top: var(--lane); width: calc(var(--len) * 1cqw); height: var(--h, max(2px, .42cqmin)); border-radius: 99px;
}
.splash--drive .trail--head {
  background: linear-gradient(90deg, rgb(195 202 236 / 0), rgb(195 202 236 / .55) 55%, #fff);
  box-shadow: 0 0 10px 1px rgb(195 202 236 / .55), 0 0 28px 3px rgb(75 121 215 / .4);
}
.splash--drive .trail--tail {
  --h: max(2px, .34cqmin);
  background: linear-gradient(270deg, rgb(175 3 3 / 0), rgb(175 3 3 / .9) 55%, color-mix(in srgb, #af0303 64%, #fa8900));
  box-shadow: 0 0 12px 2px rgb(175 3 3 / .7);
}

.splash--drive .trail--head { animation: lr var(--dur) linear var(--d) both; }
.splash--drive .trail--tail { animation: rl var(--dur) linear var(--d) both; }
.splash--drive .sweep { animation: sweep .9s linear .1s both; }
/* the pool's centre crosses screen position sx (0 = left edge, 1 = right edge) at 0.238 s + sx x 0.625 s */
.splash--drive .bulb { animation: bulb-core .26s var(--ease-out) both; animation-delay: calc(238ms + var(--sx, .5) * 625ms); }
.splash--drive .bulb::before { animation: bulb-halo .9s var(--ease-out) both; animation-delay: calc(238ms + var(--sx, .5) * 625ms); }
.splash--drive .logo { animation: fade-in .55s var(--ease-out) .34s both; }
.splash--drive .glow { animation: glow-up .8s var(--ease-out) .4s both; }
.splash--drive .tower { animation: tower-up .5s var(--ease-out) .5s both; }
.splash--drive .plate { animation: fade-in .3s var(--ease-out) .5s both; }
.splash--drive .neon { animation: neon-catch .5s steps(1, end) .58s both; }
.splash--drive .bg { animation: wipe .6s var(--ease-in) 1.7s both; }
.splash--drive .drive { animation: drive-out .6s var(--ease-in) 1.7s both; }

@keyframes lr { from { transform: translateX(-100%); } to { transform: translateX(120cqw); } }
@keyframes rl { from { transform: translateX(120cqw); } to { transform: translateX(-100%); } }
@keyframes sweep { from { transform: translateX(-44cqw); } to { transform: translateX(100cqw); } }
@keyframes bulb-core { 0% { opacity: 0; transform: scale(.45); } 45% { opacity: 1; transform: scale(1.14); } 100% { opacity: 1; transform: none; } }
@keyframes bulb-halo { 0% { opacity: 0; transform: scale(.4); } 28% { opacity: 1; transform: scale(1.1); } 100% { opacity: .58; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes glow-up { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@keyframes tower-up { from { opacity: 0; transform: translateY(8%); } to { opacity: 1; transform: none; } }
@keyframes neon-catch { 0% { opacity: .07; } 14% { opacity: 1; } 22% { opacity: .2; } 40%, 100% { opacity: 1; } }
@keyframes wipe { from { transform: none; } to { transform: translateX(140cqw); } }
@keyframes drive-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(30cqw); } }
</style>
</head>
<body>
<div class="splash splash--drive" id="splash" aria-hidden="true" data-duration="2300">
  <div class="bg" data-exit="wipe"></div>
  <div class="drive">
    <div class="rig">
      <div class="glow"></div>
      <div class="tower"></div>
      <div class="plate"><span class="neon">5700</span></div>
      <div class="board">
        <img class="logo" src="../assets/logo-sign-960.webp" srcset="../assets/logo-sign-960.webp 960w, ../assets/logo-sign-1400.webp 1400w" sizes="(max-width: 720px) 74vw, 480px" width="960" height="774" alt="" decoding="async" fetchpriority="high">
        <div class="bulbs" data-bulbs="sweep"></div>
      </div>
    </div>
    <div class="sweep"></div>
  </div>
  <div class="road">
    <i class="trail trail--head" style="--lane:60%; --d:.08s; --dur:.92s; --len:46"></i>
    <i class="trail trail--tail" style="--lane:22%; --d:.16s; --dur:1.1s; --len:30"></i>
    <i class="trail trail--head" style="--lane:80%; --d:.34s; --dur:.88s; --len:38"></i>
    <i class="trail trail--tail" style="--lane:36%; --d:.52s; --dur:1.04s; --len:26"></i>
    <i class="trail trail--head" style="--lane:70%; --d:.82s; --dur:.9s; --len:42"></i>
    <i class="trail trail--tail" style="--lane:28%; --d:1.08s; --dur:1s; --len:28"></i>
    <i class="trail trail--head" style="--lane:74%; --d:1.52s; --dur:.74s; --len:64"></i>
  </div>
</div>

<main class="standin">
  <h1 class="standin__title">A traditional dispensary with a modern twist.</h1>
  <button class="pill" type="button">Order now</button>
</main>

<script src="splash.js"></script>
</body>
</html>
